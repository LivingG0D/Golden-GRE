name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh install.sh
      - name: scripts are executable & have bash shebang
        run: |
          for s in scripts/*.sh tests/*.sh install.sh; do
            head -1 "$s" | grep -q '^#!/usr/bin/env bash' || { echo "bad shebang: $s"; exit 1; }
            # README tells users to run ./install.sh directly, so the committed
            # mode has to carry +x — a shebang alone does not make it runnable.
            [ -x "$s" ] || { echo "not executable: $s"; exit 1; }
          done
          echo "shebangs + exec bits ok"
      - name: example configs define required keys
        run: |
          for k in DEV LOCAL_PUB REMOTE_PUB TUN_ADDR FOU_PORT; do
            grep -q "$k" examples/point-to-point.conf.example || { echo "example missing $k"; exit 1; }
          done
          echo "examples ok"

  e2e:
    name: End-to-end tunnel (network namespaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.sh
        run: sudo ./install.sh
      - name: two namespaces, one tunnel — up, ping, down
        run: sudo tests/e2e.sh
      - name: systemd wiring — check timer follows the tunnel
        run: sudo tests/systemd.sh
